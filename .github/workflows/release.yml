name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версія релізу, напр. 1.0.0 (порожньо — лише збірка)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # A manual run with a version publishes a release; tag pushes still work too.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check Python sources
        run: python3 -m py_compile app/*.py

      - name: Build app, DMG and ZIP
        run: bash macos/make-release.sh "${VERSION#v}"

      - name: Smoke test the bundled engine
        run: |
          APP="macos/build/YT Grab.app"
          "$APP/Contents/MacOS/uv" --version
          cd "$APP/Contents/Resources/ytgrab"
          YTGRAB_NO_BROWSER=1 YTGRAB_PORT=8790 PYTHONDONTWRITEBYTECODE=1 \
            "../../MacOS/uv" run --quiet --no-project --python 3.12 app.py > /tmp/ytgrab.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8790/api/status > /tmp/status.json && break
            sleep 2
          done
          cat /tmp/ytgrab.log
          python3 -c 'import json; d = json.load(open("/tmp/status.json")); print("tools:", d["tools"])'
          curl -sf http://127.0.0.1:8790/ | grep -q "YT Grab"

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Grab
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          gh release create "$TAG" dist/YT-Grab.dmg dist/YT-Grab.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "YT Grab $TAG" --notes-file macos/release-notes.md
